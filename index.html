<!doctype html>
<html lang="zh-Hant" data-initializing>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const storedTheme = window.localStorage.getItem('placeprint:theme:v1');
        if (['nando', 'koubai', 'konjou', 'kincha'].includes(storedTheme)) {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch {
        // Storage can be unavailable in private or restricted browsing modes.
      }
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta
      name="description"
      content="將地標跟照片做成回憶的拍立得"
    />
    <meta name="application-name" content="Placeprint" />
    <meta name="apple-mobile-web-app-title" content="Placeprint" />
    <meta property="og:title" content="地標拍立得 Placeprint" />
    <meta property="og:site_name" content="地標拍立得 Placeprint" />
    <meta property="og:description" content="將地標跟照片做成回憶的拍立得" />
    <meta name="twitter:title" content="地標拍立得 Placeprint" />
    <meta name="twitter:description" content="將地標跟照片做成回憶的拍立得" />
    <title>地標拍立得 Placeprint</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./">
          <span class="brand-mark">
            <span></span><span></span><span></span>
          </span>
          <span>
            <strong>地標拍立得</strong>
            <small>Placeprint</small>
          </span>
        </a>
        <div id="kofi-widget" class="kofi-widget">
          <script src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"></script>
          <script>
            if (window.kofiwidget2) {
              const themeColor = getComputedStyle(document.documentElement)
                .getPropertyValue('--theme-kofi').trim() || '#087f8a';
              window.kofiwidget2.init('Buy me a coffee', themeColor, 'H2Y624M8O8');
              window.kofiwidget2.draw();
              const widget = document.getElementById('kofi-widget');
              const decorateLink = () => {
                const link = widget && widget.querySelector('a.kofi-button');
                if (!link) {
                  return false;
                }
                link.setAttribute('rel', 'noopener noreferrer');
                return true;
              };
              if (!decorateLink() && widget) {
                const observer = new MutationObserver(() => {
                  if (decorateLink()) {
                    observer.disconnect();
                  }
                });
                observer.observe(widget, { childList: true, subtree: true });
              }
            } else {
              document.getElementById('kofi-widget')?.setAttribute('data-widget-error', 'true');
            }
          </script>
        </div>
      </header>

      <main class="workspace" data-editor-open="true">
        <section class="preview-panel">

          <div class="canvas-frame">
            <div class="canvas-surface">
              <canvas
                id="card-preview"
                width="1536"
                height="1919"
              >
                分享卡片預覽
              </canvas>

              <button
                id="photo-picker"
                class="photo-picker"
                type="button"
              >
                <span class="photo-picker-mark">＋</span>
                <strong>加入照片</strong>
              </button>
              <button
                id="replace-photo-button"
                class="replace-photo-button"
                type="button"
                hidden
              >
                更換照片
              </button>

              <div
                id="photo-pan-target"
                class="photo-pan-target"
                hidden
              ></div>
              <canvas
                id="photo-navigator"
                class="photo-navigator"
                width="160"
                height="110"
                hidden
              ></canvas>

              <button
                id="info-hotspot"
                class="info-hotspot"
                type="button"
              >
                <span id="info-reveal-overlay" class="info-reveal-overlay"></span>
                <span class="info-hotspot-label">編輯地點資料</span>
                <span id="info-ghost" class="info-ghost">
                  <span class="ghost-name">店名</span>
                  <span class="ghost-line ghost-rating">★ 評分 · 評價數</span>
                  <span class="ghost-line ghost-category">類別 · 價格帶</span>
                  <span class="ghost-line ghost-hours">營業時間</span>
                  <span class="ghost-line ghost-address">地址</span>
                </span>
              </button>
            </div>
          </div>

          <input
            id="photo-input"
            name="photo"
            type="file"
            accept="image/*,.heic,.heif"
            hidden
          />


          <div
            id="manual-export-fallback"
            class="export-fallback"
            hidden
          >
            <p>若未自動下載，請點擊下方預覽圖並長按「儲存影像」</p>
            <a
              id="manual-export-link"
              target="_blank"
              rel="noopener noreferrer"
            >
              開啟 PNG 預覽
            </a>
          </div>

          <div class="preview-actions" data-theme-picker-visible="false">
            <div id="theme-picker-wrapper" class="theme-picker-wrapper" hidden>
              <button
                id="theme-picker-trigger"
                class="theme-picker-trigger action-button"
                type="button"
                hidden
              >
                更換配色
              </button>
              <div id="theme-picker-panel" class="theme-picker-panel" hidden></div>
            </div>
            <p id="status" class="status"></p>
            <button id="download-button" class="primary-button action-button" type="button"><span>下載圖片</span></button>
          </div>
        </section>

        <section id="editor-panel" class="editor-panel">
          <form id="editor-form" class="editor-form">
              <button id="close-editor-button" class="close-editor-button" type="button">
                收合編輯器
              </button>

              <section class="field-section url-section">
                <div class="section-heading compact">
                  <h3 id="url-title">從網址自動取得資料</h3>
                  <p class="field-help">支援 Google 地圖完整網址或分享短網址</p>
                </div>
                <div class="url-input-row">
                  <div class="field-group">
                    <input
                      id="maps-url"
                      name="mapsUrl"
                      type="text"
                      inputmode="url"
                      placeholder="https://www.google.com/maps/place/..."
                      maxlength="2048"
                      autocomplete="off"
                      spellcheck="false"
                    />
                  </div>
                  <p id="maps-url-error" class="field-error" hidden></p>
                  <button id="fetch-place-button" class="secondary-button" type="button">
                    自動抓取資料
                  </button>
                </div>
              </section>

              <section class="field-section">
                <div class="section-heading compact">
                  <h3 id="details-title">地點資料</h3>
                </div>

                <div class="field-grid">
                  <div class="field-group field-group-wide">
                    <label for="store-name">店名</label>
                    <input
                      id="store-name"
                      name="storeName"
                      type="text"
                      placeholder="Café Sanduhr"
                      autocomplete="off"
                    />
                  </div>

                  <div class="field-group">
                    <label for="rating">平均評分</label>
                    <input
                      id="rating"
                      name="rating"
                      type="number"
                      min="0"
                      max="5"
                      step="0.1"
                      inputmode="decimal"
                      placeholder="4.1"
                      autocomplete="off"
                    />
                    <p id="rating-error" class="field-error" hidden></p>
                  </div>

                  <div class="field-group">
                    <label for="review-count">評價數</label>
                    <input
                      id="review-count"
                      name="reviewCount"
                      type="number"
                      min="0"
                      max="999999999"
                      step="1"
                      inputmode="numeric"
                      placeholder="291"
                      autocomplete="off"
                    />
                    <p id="review-count-error" class="field-error" hidden></p>
                  </div>

                  <div class="field-group">
                    <label for="category">類別</label>
                    <input
                      id="category"
                      name="category"
                      type="text"
                      maxlength="48"
                      placeholder="咖啡廳"
                      autocomplete="off"
                    />
                  </div>

                  <div class="field-group">
                    <label for="price-text">價格帶</label>
                    <input
                      id="price-text"
                      name="priceText"
                      type="text"
                      maxlength="32"
                      placeholder="2500~5000￥"
                      autocomplete="off"
                    />
                  </div>

                  <div class="field-group field-group-wide">
                    <label for="hours-select">營業時間</label>
                    <select id="hours-select" name="hoursOption"></select>
                    <input
                      id="custom-hours"
                      name="customHours"
                      type="text"
                      maxlength="80"
                      placeholder="平日10:00~20:30"
                      autocomplete="off"
                      hidden
                    />
                  </div>

                  <div class="field-group field-group-wide">
                    <label for="address">地址</label>
                    <input
                      id="address"
                      name="address"
                      type="text"
                      placeholder="見滝原市 臨海中央区 水上プロムナード 2-4-10"
                      autocomplete="street-address"
                    />
                  </div>

                  <div class="field-group">
                    <label for="social-id">社群 ID</label>
                    <input
                      id="social-id"
                      name="socialId"
                      type="text"
                      maxlength="64"
                      placeholder="@underlotus"
                      autocomplete="off"
                      spellcheck="false"
                    />
                  </div>

                  <div class="field-group">
                    <label for="qr-code">QR Code</label>
                    <input
                      id="qr-code"
                      name="qrCode"
                      type="text"
                      inputmode="url"
                      placeholder="https://www.google.com/maps/place/..."
                      autocomplete="off"
                      spellcheck="false"
                    />
                    <p id="qr-code-error" class="field-error" hidden></p>
                  </div>
                </div>
              </section>

              <button id="clear-data-button" class="clear-data-button action-button" type="button"><span class="action-button__icon">✗</span><span>清空資料</span></button>
          </form>
        </section>
      </main>
    </div>
    <script>
      const initialEditorExpanded = window.matchMedia('(min-width: 960px)').matches;
      document.querySelector('.workspace').dataset.editorOpen = String(initialEditorExpanded);
      document.getElementById('editor-panel').hidden = !initialEditorExpanded;
      document.documentElement.removeAttribute('data-initializing');
    </script>
    <script type="module" src="/src/main.ts"></script>
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d52caa40cd10497c9e8142087fff902b"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
